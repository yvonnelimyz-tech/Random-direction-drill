<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Random Direction Drill</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#111;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
  padding:35px 20px;
}

.app{
  width:100%;
  max-width:480px;
  margin:auto;
}

h1{
  font-size:28px;
  margin-bottom:5px;
}

.subtitle{
  color:#999;
  margin-bottom:20px;
}

#timer{
  font-size:70px;
  font-weight:bold;
  margin-top:25px;
  font-variant-numeric:tabular-nums;
}

#cue{
  font-size:52px;
  font-weight:900;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.05;
}

.box{
  background:#222;
  padding:18px;
  border-radius:18px;
  margin:15px auto;
}

.label{
  color:#aaa;
  font-size:14px;
  margin-bottom:8px;
}

button{
  font-size:16px;
  padding:12px 14px;
  border:0;
  border-radius:12px;
  margin:4px;
  cursor:pointer;
}

.mode{
  background:#444;
  color:white;
}

.active{
  background:white;
  color:#111;
}

.section{
  margin:14px 0;
}

#start{
  display:block;
  width:100%;
  margin:18px auto;
  background:white;
  color:#111;
  font-weight:bold;
  font-size:21px;
  padding:18px;
}

#start.running{
  background:#ff453a;
  color:white;
}

.doubleRow{
  margin-top:20px;
}

.note{
  color:#777;
  font-size:13px;
  line-height:1.5;
  margin-top:15px;
}

</style>
</head>


<body>

<div class="app">

<h1>Random Direction Drill</h1>

<div class="subtitle">
Listen. React. Keep moving.
</div>


<div id="timer">1:30</div>

<div id="cue">
READY
</div>


<div class="box">

<div class="section">

<div class="label">
ROUND
</div>

<button id="short" class="mode">
30 sec
</button>

<button id="medium" class="mode">
60 sec
</button>

<button id="long" class="mode active">
90 sec
</button>

</div>


<div class="section">

<div class="label">
CALL INTERVAL
</div>

<button id="slow" class="mode active">
4–8 sec
</button>

<button id="fast" class="mode">
2–4 sec
</button>

<button id="rapid" class="mode">
1–2 sec
</button>

</div>


<div class="doubleRow">

<label>
<input type="checkbox" id="double" checked>
Occasional double calls
</label>

</div>

</div>


<button id="start">
START 90 SEC
</button>


<div class="note">
Front · Back · Left · Right<br>
Repeats are possible, but reduced.<br>
Maximum two identical directions in a row.
</div>

</div>


<script>

/* ------------------------------
   BASIC SETTINGS
-------------------------------- */

const directions=[
  "FRONT",
  "RIGHT",
  "BACK",
  "LEFT"
];

let minGap=4;
let maxGap=8;

let duration=90;

let running=false;

let endTime;

let timerInterval;
let callTimeout;

let history=[];

let wakeLock=null;


/* ------------------------------
   ELEMENTS
-------------------------------- */

const cue=
document.getElementById("cue");

const timer=
document.getElementById("timer");

const start=
document.getElementById("start");

const slow=
document.getElementById("slow");

const fast=
document.getElementById("fast");

const rapid=
document.getElementById("rapid");

const short=
document.getElementById("short");

const medium=
document.getElementById("medium");

const long=
document.getElementById("long");

const doubleCalls=
document.getElementById("double");


/* ------------------------------
   HELPERS
-------------------------------- */

function formatTime(seconds){

  return (
    Math.floor(seconds/60)
    +":"
    +String(seconds%60).padStart(2,"0")
  );

}


function setActive(group,activeButton){

  group.forEach(button=>
    button.classList.remove("active")
  );

  activeButton.classList.add("active");

}


/* ------------------------------
   ROUND LENGTH
-------------------------------- */

short.onclick=()=>{

  if(running)return;

  duration=30;

  setActive(
    [short,medium,long],
    short
  );

  timer.textContent="0:30";
  start.textContent="START 30 SEC";

};


medium.onclick=()=>{

  if(running)return;

  duration=60;

  setActive(
    [short,medium,long],
    medium
  );

  timer.textContent="1:00";
  start.textContent="START 60 SEC";

};


long.onclick=()=>{

  if(running)return;

  duration=90;

  setActive(
    [short,medium,long],
    long
  );

  timer.textContent="1:30";
  start.textContent="START 90 SEC";

};


/* ------------------------------
   SPEED
-------------------------------- */

slow.onclick=()=>{

  if(running)return;

  minGap=4;
  maxGap=8;

  setActive(
    [slow,fast,rapid],
    slow
  );

};


fast.onclick=()=>{

  if(running)return;

  minGap=2;
  maxGap=4;

  setActive(
    [slow,fast,rapid],
    fast
  );

};


rapid.onclick=()=>{

  if(running)return;

  minGap=1;
  maxGap=2;

  setActive(
    [slow,fast,rapid],
    rapid
  );

};


/* ------------------------------
   KEEP SCREEN AWAKE
-------------------------------- */

async function keepAwake(){

  if(!("wakeLock" in navigator))
    return;

  try{

    wakeLock=
      await navigator.wakeLock.request("screen");

  }catch(error){

    wakeLock=null;

  }

}


async function releaseWakeLock(){

  if(!wakeLock)
    return;

  try{

    await wakeLock.release();

  }catch(error){}

  wakeLock=null;

}


/*
If Safari temporarily releases the lock,
request it again when the page becomes visible.
*/

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState==="visible"
      &&
      running
      &&
      !wakeLock
    ){

      keepAwake();

    }

  }
);


/* ------------------------------
   DIRECTION SELECTION
-------------------------------- */

function pickDirection(exclude=null){

  let options=
    directions.filter(
      direction=>direction!==exclude
    );


  /*
  Never allow three identical
  directions in a row.
  */

  if(
    history.length>=2
    &&
    history.at(-1)===history.at(-2)
  ){

    options=
      options.filter(
        direction=>
          direction!==history.at(-1)
      );

  }


  /*
  Repeats ARE allowed.

  But 75% of the time after a single
  direction, remove it from the next draw.

  This keeps occasional doubles without
  making repeated calls annoying.
  */

  else if(
    history.length>=1
    &&
    Math.random()<0.75
  ){

    options=
      options.filter(
        direction=>
          direction!==history.at(-1)
      );

  }


  /*
  Block obvious full clockwise or
  counter-clockwise square patterns.

  FRONT → RIGHT → BACK → LEFT
  FRONT → LEFT → BACK → RIGHT
  etc.
  */

  if(history.length>=3){

    const position={
      FRONT:0,
      RIGHT:1,
      BACK:2,
      LEFT:3
    };

    const a=
      position[history.at(-3)];

    const b=
      position[history.at(-2)];

    const c=
      position[history.at(-1)];


    options=
      options.filter(direction=>{

        const d=
          position[direction];


        const clockwise=

          (b-a+4)%4===1
          &&
          (c-b+4)%4===1
          &&
          (d-c+4)%4===1;


        const counterClockwise=

          (a-b+4)%4===1
          &&
          (b-c+4)%4===1
          &&
          (c-d+4)%4===1;


        return (
          !clockwise
          &&
          !counterClockwise
        );

      });

  }


  /*
  Safety fallback.
  */

  if(options.length===0){

    options=
      directions.filter(
        direction=>direction!==exclude
      );

  }


  const choice=
    options[
      Math.floor(
        Math.random()*options.length
      )
    ];


  history.push(choice);


  if(history.length>12)
    history.shift();


  return choice;

}


/* ------------------------------
   SPEECH
-------------------------------- */

function speak(text){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();


  const voice=
    new SpeechSynthesisUtterance(text);


  voice.rate=1.2;

  voice.pitch=1;

  voice.volume=1;


  speechSynthesis.speak(voice);

}


/* ------------------------------
   MAKE A CALL
-------------------------------- */

function makeCall(){

  if(!running)
    return;


  const first=
    pickDirection();


  let spoken=first;

  let displayed=first;


  /*
  Approximately 22% chance
  of a double call.
  */

  if(
    doubleCalls.checked
    &&
    Math.random()<0.22
  ){

    const second=
      pickDirection(first);


    spoken=
      first+", "+second;


    displayed=
      first+"<br>"+second;

  }


  cue.innerHTML=displayed;

  speak(spoken);

  scheduleNextCall();

}


/* ------------------------------
   NEXT RANDOM INTERVAL
-------------------------------- */

function scheduleNextCall(){

  if(!running)
    return;


  const seconds=

    minGap
    +
    Math.random()
    *
    (maxGap-minGap);


  callTimeout=
    setTimeout(
      ()=>{

        if(
          running
          &&
          Date.now()<endTime
        ){

          makeCall();

        }

      },

      seconds*1000

    );

}


/* ------------------------------
   TIMER
-------------------------------- */

function updateTimer(){

  const remaining=
    Math.max(
      0,
      endTime-Date.now()
    );


  const seconds=
    Math.ceil(
      remaining/1000
    );


  timer.textContent=
    formatTime(seconds);


  if(remaining<=0){

    finishRound();

  }

}


/* ------------------------------
   START
-------------------------------- */

function beginRound(){

  running=true;

  history=[];


  endTime=
    Date.now()
    +
    duration*1000;


  timer.textContent=
    formatTime(duration);


  cue.textContent="GO";


  start.textContent="STOP";

  start.classList.add("running");


  /*
  User's button tap triggers both
  speech and Wake Lock.
  */

  keepAwake();

  speak("Go");


  timerInterval=
    setInterval(
      updateTimer,
      200
    );


  callTimeout=
    setTimeout(
      makeCall,
      1200
    );

}


/* ------------------------------
   FINISH
-------------------------------- */

function finishRound(){

  if(!running)
    return;


  running=false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    callTimeout
  );


  releaseWakeLock();


  timer.textContent="0:00";

  cue.textContent="DONE";


  start.textContent=
    "START "
    +
    duration
    +
    " SEC";


  start.classList.remove(
    "running"
  );


  speak("Done");

}


/* ------------------------------
   MANUAL STOP
-------------------------------- */

function stopRound(){

  running=false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    callTimeout
  );


  releaseWakeLock();


  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }


  timer.textContent=
    formatTime(duration);


  cue.textContent="READY";


  start.textContent=
    "START "
    +
    duration
    +
    " SEC";


  start.classList.remove(
    "running"
  );

}


/* ------------------------------
   START / STOP BUTTON
-------------------------------- */

start.onclick=()=>{

  if(running){

    stopRound();

  }else{

    beginRound();

  }

};

</script>

</body>
</html>
