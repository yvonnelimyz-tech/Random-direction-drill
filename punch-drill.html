<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111416">
<title>Punch Drill</title>
<style>
:root {
  color-scheme: dark;
  --bg:#111416; --panel:#1a2022; --line:#303a3c; --ink:#f4f3ee;
  --muted:#a4afad; --accent:#d7f26a; --accent-ink:#161a0c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#293538 0,var(--bg) 48%);color:var(--ink);display:flex;justify-content:center}
button{font:inherit;color:inherit}
main{width:min(480px,100%);padding:18px 16px 30px}
.site-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;background:#171c1e}
.site-nav a{padding:9px;color:var(--muted);text-align:center;text-decoration:none;font-size:13px;font-weight:750}
.site-nav a[aria-current=page]{border-radius:10px;color:var(--accent-ink);background:var(--accent)}
.topline{display:flex;justify-content:space-between;align-items:center;margin:0 3px 8px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.13em}
.hero{text-align:center;padding:6px 8px 14px}
.timer{font-size:clamp(58px,17vw,78px);font-weight:760;letter-spacing:-.075em;font-variant-numeric:tabular-nums;line-height:1}
.phase{margin-top:8px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.16em}
.call-card{display:flex;align-items:center;justify-content:center;min-height:170px;padding:18px 10px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#202729,#171c1e 72%);text-align:center}
.call{display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,12px);width:100%;min-height:120px;font-size:clamp(54px,17.5vw,88px);font-weight:850;letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.digit{animation:pop .16s ease-out both}
@keyframes pop{from{opacity:.45;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
.action{width:100%;min-height:58px;margin-top:12px;border:0;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:850;letter-spacing:.08em;cursor:pointer}
.action.running{border:1px solid #414b4e;background:#293133;color:var(--ink)}
.action:active{transform:scale(.99)}
.settings{margin-top:15px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#181e20}
.setting{margin:0}
.setting+.setting{margin-top:14px}
.setting-label{margin:0 0 7px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.option{min-height:42px;border:1px solid #344043;border-radius:11px;background:#202729;color:#c7cfcc;font-size:12px;font-weight:750;cursor:pointer}
.option.selected{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.option:disabled{opacity:.55}
.key{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:#181e20}
.key summary{color:#c7cfcc;font-size:12px;font-weight:750;cursor:pointer}
.key-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:11px}
.key-item{display:flex;align-items:center;gap:8px;padding:7px;border-radius:10px;background:#202729}
.key-num{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:850}
.key-text{font-size:11px;line-height:1.25}
.key-text small{display:block;color:var(--muted);font-size:10px}
@media(max-width:350px){main{padding-inline:12px}.call{font-size:clamp(48px,16vw,70px)}}
</style>
</head>
<body>
<main>
  <nav class="site-nav" aria-label="Choose a drill">
    <a href="./index.html">Directions</a>
    <a href="./punch-drill.html" aria-current="page">Punches</a>
  </nav>
  <div class="topline"><span>PUNCH DRILL</span><span id="modeLabel">READY</span></div>
  <section class="hero" aria-label="Round timer">
    <div class="timer" id="timer" aria-live="off">1:00</div>
    <div class="phase" id="phaseLabel">BUILD</div>
  </section>
  <section class="call-card" aria-label="Punch combination">
    <div class="call" id="call" aria-live="assertive"><span class="digit">READY</span></div>
  </section>
  <button class="action" id="startButton" type="button" aria-pressed="false">START</button>
  <section class="settings" aria-label="Round settings">
    <div class="setting">
      <p class="setting-label">Round</p>
      <div class="options" id="durationOptions">
        <button class="option selected" data-duration="60" type="button" aria-pressed="true">60 sec</button>
        <button class="option" data-duration="90" type="button" aria-pressed="false">90 sec</button>
        <button class="option" data-duration="120" type="button" aria-pressed="false">120 sec</button>
      </div>
    </div>
    <div class="setting">
      <p class="setting-label">Level</p>
      <div class="options" id="levelOptions">
        <button class="option selected" data-level="1" type="button" aria-pressed="true">1–2</button>
        <button class="option" data-level="2" type="button" aria-pressed="false">1–4</button>
        <button class="option" data-level="3" type="button" aria-pressed="false">1–6</button>
      </div>
    </div>
  </section>
  <details class="key">
    <summary>Number key</summary>
    <div class="key-grid">
      <div class="key-item"><span class="key-num">1</span><span class="key-text">Jab<small>Lead hand</small></span></div>
      <div class="key-item"><span class="key-num">2</span><span class="key-text">Cross<small>Rear hand</small></span></div>
      <div class="key-item"><span class="key-num">3</span><span class="key-text">Hook<small>Lead hand</small></span></div>
      <div class="key-item"><span class="key-num">4</span><span class="key-text">Hook<small>Rear hand</small></span></div>
      <div class="key-item"><span class="key-num">5</span><span class="key-text">Uppercut<small>Lead hand</small></span></div>
      <div class="key-item"><span class="key-num">6</span><span class="key-text">Uppercut<small>Rear hand</small></span></div>
    </div>
  </details>
</main>
<script>
  const mirrorPunch={1:2,2:1,3:4,4:3,5:6,6:5};

function addMirrors(patterns){
  const unique=new Map();
  patterns.forEach(combo=>{
    unique.set(combo.join(''),combo);
    const mirrored=combo.map(n=>mirrorPunch[n]||n);
    unique.set(mirrored.join(''),mirrored);
  });
  return [...unique.values()];
}

const pools={
  1:{
    2:[[1,2],[1,1],[2,1]],
    4:[[1,1,2,1],[1,2,1,2],[1,2,1,1],[2,1,2,1],[2,1,1,2]],
    6:[[1,1,2,1,2,1],[1,2,1,2,1,2],[1,2,1,1,2,1],[2,1,2,1,2,1],[1,1,1,2,1,2]]
  },
  2:{
    2:addMirrors([
      [1,2],[1,3],[1,4],[2,3],[2,4],[3,2],[4,2]
    ]),
    4:addMirrors([
      [1,2,3,2],[1,1,2,3],[1,2,4,2],[1,3,2,1],
      [1,2,3,4],[2,3,2,1],[1,3,2,4],[1,2,4,3],
      [3,2,3,2],[1,4,2,3],[1,2,3,1],[2,4,2,3]
    ]),
    6:addMirrors([
      [1,2,3,2,4,2],[1,3,2,3,2,4],[1,2,4,2,3,2],
      [2,3,2,1,4,2],[1,1,2,3,2,4],[1,3,2,4,3,2],
      [1,2,3,2,3,4],[1,2,3,4,2,3],[2,3,1,2,4,2],
      [1,4,2,3,2,1],[1,2,4,3,2,3],[2,1,3,2,4,2]
    ])
  },
  3:{
    2:addMirrors([
      [1,5],[2,6],[1,6],[3,5],[4,6],[2,5],[3,6],[4,5]
    ]),
    4:addMirrors([
      [1,2,5,2],[1,2,3,5],[1,2,6,3],[2,3,6,2],
      [1,4,2,5],[1,2,5,3],[3,2,6,2],[1,2,4,6],
      [2,1,5,2],[2,4,1,6],[1,3,2,6],[4,2,3,5]
    ]),
    6:addMirrors([
      [1,2,3,2,5,2],[1,2,5,2,3,2],[1,2,6,3,2,3],
      [1,3,2,5,2,4],[2,3,2,5,2,3],[1,2,4,2,6,3],
      [1,4,2,3,5,2],[1,2,3,6,3,2],[1,1,2,5,2,3],
      [2,1,2,6,3,2],[1,2,5,3,2,4],[2,3,1,2,6,2],
      [1,4,2,5,2,3],[3,2,1,2,5,2]
    ])
  }
};
const timerEl=document.getElementById('timer');
const callEl=document.getElementById('call');
const startButton=document.getElementById('startButton');
const modeLabel=document.getElementById('modeLabel');
const phaseLabel=document.getElementById('phaseLabel');
let duration=60,level=1,running=false,endAt=0,intervalId=null,callTimeout=null,wakeLock=null,lastCalls=[],speechToken=0;
const numberWords=['','one','two','three','four','five','six'];

function formatTime(seconds){
  seconds=Math.max(0,Math.ceil(seconds));
  return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function currentStage(){
  const elapsed=duration-Math.max(0,(endAt-Date.now())/1000);
  return Math.min(2,Math.floor((elapsed/duration)*3));
}
function updateStage(){
  phaseLabel.textContent=['BUILD','FLOW','FINISH'][currentStage()];
}
function renderCall(text){
  callEl.replaceChildren(...text.split(' ').map((n,i)=>{
    const span=document.createElement('span');
    span.className='digit';
    span.textContent=n;
    span.style.animationDelay=(i*22)+'ms';
    return span;
  }));
}
function chooseCombo(length){
  const options=pools[level][length];
  const key=combo=>combo.join('');
  let choices=options.filter(combo=>!lastCalls.includes(key(combo)));
  if(!choices.length)choices=options;
  const selected=choices[Math.floor(Math.random()*choices.length)];
  lastCalls.push(key(selected));
  if(lastCalls.length>3)lastCalls.shift();
  return selected;
}
function stopSpeech(){
  speechToken++;
  if('speechSynthesis'in window)window.speechSynthesis.cancel();
}
function speak(text,onFinished){
  if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){
    if(onFinished)setTimeout(onFinished,500);
    return;
  }
  const token=++speechToken;
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.rate=1.25;
  utterance.pitch=1;
  utterance.volume=1;
  const finish=()=>{if(token===speechToken&&onFinished)onFinished();};
  utterance.onend=finish;
  utterance.onerror=finish;
  window.speechSynthesis.speak(utterance);
}
function responseSeconds(length){return 1.45+length*0.62;}
function announceNext(){
  if(!running)return;
  const length=[2,4,6][currentStage()];
  const remaining=(endAt-Date.now())/1000;
  const speechSeconds=0.55+length*0.31;
  if(remaining<speechSeconds+responseSeconds(length)+0.25)return;
  const combo=chooseCombo(length);
  renderCall(combo.join(' '));
  speak(combo.map(n=>numberWords[n]).join(', '),()=>{
    if(!running)return;
    const wait=responseSeconds(combo.length);
    callTimeout=setTimeout(announceNext,wait*1000);
  });
}
function update(){
  if(!running)return;
  const remaining=(endAt-Date.now())/1000;
  timerEl.textContent=formatTime(remaining);
  updateStage();
  if(remaining<=0)finishRound(false);
}
async function requestWakeLock(){
  if(!('wakeLock'in navigator)||!running)return;
  try{wakeLock=await navigator.wakeLock.request('screen');}
  catch(e){wakeLock=null;}
}
function setControlsDisabled(disabled){
  document.querySelectorAll('.option').forEach(button=>button.disabled=disabled);
}
function startRound(){
  if(running){finishRound(true);return;}
  running=true;
  lastCalls=[];
  endAt=Date.now()+duration*1000;
  startButton.classList.add('running');
  startButton.textContent='STOP';
  startButton.setAttribute('aria-pressed','true');
  modeLabel.textContent='LIVE';
  renderCall('GO');
  setControlsDisabled(true);
  requestWakeLock();
  update();
  intervalId=setInterval(update,100);
  speak('Go',()=>{
    if(running)callTimeout=setTimeout(announceNext,450);
  });
}
function finishRound(manual){
  if(!running)return;
  running=false;
  clearInterval(intervalId);
  clearTimeout(callTimeout);
  stopSpeech();
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}
  startButton.classList.remove('running');
  startButton.textContent='START';
  startButton.setAttribute('aria-pressed','false');
  modeLabel.textContent=manual?'STOPPED':'DONE';
  renderCall(manual?'STOP':'DONE');
  timerEl.textContent=manual?formatTime((endAt-Date.now())/1000):'0:00';
  if(!manual)phaseLabel.textContent='FINISHED';
  setControlsDisabled(false);
  if(!manual)speak('Done');
}
function setDuration(value,button){
  if(running)return;
  duration=Number(value);
  timerEl.textContent=formatTime(duration);
  document.querySelectorAll('#durationOptions .option').forEach(el=>{
    const selected=el===button;
    el.classList.toggle('selected',selected);
    el.setAttribute('aria-pressed',String(selected));
  });
}
function setLevel(value,button){
  if(running)return;
  level=Number(value);
  document.querySelectorAll('#levelOptions .option').forEach(el=>{
    const selected=el===button;
    el.classList.toggle('selected',selected);
    el.setAttribute('aria-pressed',String(selected));
  });
  phaseLabel.textContent='BUILD';
}
document.querySelectorAll('#durationOptions .option').forEach(button=>{
  button.addEventListener('click',()=>setDuration(button.dataset.duration,button));
});
document.querySelectorAll('#levelOptions .option').forEach(button=>{
  button.addEventListener('click',()=>setLevel(button.dataset.level,button));
});
startButton.addEventListener('click',startRound);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&running&&(!wakeLock||wakeLock.released))requestWakeLock();
});
</script>
</body>
</html>
